<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

    <h1>Register</h1>

    <form id="upload-form">

        <p>
            <label for="username">Username</label><br>
            <input type="text" id="username" name="username" required>
        </p>

        <p>
            <label for="email">Email address</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password</label><br>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >
        </p>

        <p>
            <label for="confirm_password">Confirm password</label><br>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >
        </p>

        <p>
            <label for="file">Upload your image</label><br>
            <input
                type="file"
                id="file"
                name="file"
                accept="image/*"
                required
            >
        </p>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>

    <div id="result"></div>

    <script>
        const form = document.getElementById("upload-form");
        const message = document.getElementById("message");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            message.textContent = "";
            result.replaceChildren();

            // Check whether passwords match
            const password = form.elements.password.value;
            const confirmPassword = form.elements.confirm_password.value;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                return;
            }

            try {
                message.textContent = "Registering...";

                // Send form data to FastAPI
                const response = 
                await fetch("/register/", {
                    method: "POST",
                    body: new FormData(form)
                });

                const data = await response.json();
                console.log(data)

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Registration failed!"
                    );
                }

                // Display username
                const heading = document.createElement("h2");
                heading.textContent = "Registered User";

                const username = document.createElement("p");
                username.textContent = "Username: " + data.username;

                // Display email
                const email = document.createElement("p");
                email.textContent = "Email: " + data.email;

                result.append(heading, username, email);

                // Display uploaded image
                if (data.url) {
                    const image = document.createElement("img");

                    image.src = data.url;
                    image.alt = "Uploaded profile photo";
                    image.width = 200;

                    result.append(image);
                }

                message.textContent = "Registration successful!";

                // Clear the form after successful registration
                form.reset();

            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>

</body>
</html>
